name: HR-01-Community Building
step: community-building
summary: |-
  Gather motivated individuals who want to participate in the community. Find among them members of the steering committee who will make decisions during the planning process.
description: |-
  Helping the initiators in laying the foundations of the future community: notifications to future members via phone calls, social networks and/or local media about the initiative; first gathering of future members; decision: members of steering committee.
input: |-
  Initiators will use their own information and contacts to invite future members to the first meeting.
result: |-
  Strong team of motivated people; Key members identified; Strong relationships nurtured
remaining_hurdles: |-
  Distrust in the system of joint investment/sharing models; Lack of information; Lack of examples of good practice
duration: '2-4 weeks'
cost: 'Minimal'
cost_estimate: '< 500 EUR'
provider: oss
hr:
  name: HR-01-Izgradnja zajednice
  summary: |-
    Okupite motivirane osobe koje žele sudjelovati u zajednici. Među njima pronađite članove upravljačkog odbora koji će donositi odluke tijekom planiranja.
  description: |-
    Pomoć inicijatorima u postavljanju temelja buduće zajednice: obavještavanje budućih članova o inicijativi telefonom, putem društvenih mreža i/ili lokalnih medija; prvo okupljanje budućih članova; odluka o članovima upravljačkog odbora.
  input: |-
    Inicijatori će vlastitim informacijama i kontaktima pozvati buduće članove na prvi sastanak.
  result: Snažan tim motiviranih ljudi; utvrđeni ključni članovi; njegovani čvrsti odnosi
  remaining_hurdles: |-
    Nepovjerenje u modele zajedničkog ulaganja i dijeljenja; nedostatak informacija; nedostatak primjera dobre prakse
  duration: '2-4 tjedna'
  cost: 'Minimalni troškovi'
  cost_estimate: '< 500 EUR'
  reviewed: false
