name: HR-03-Value Proposition
step: value-proposition
summary: |-
  The initial vision of your project should clearly outline its overarching goals and aspirations. Consider the potential outcomes of the project to define its success criteria and impact.
description: |-
  Help initiators to better define: purpose and vision of the community; main goals and outcomes; possible benefits for members and the community
input: |-
  Initiators should provide first ideas of: purpose and vision of project; potential outcomes; expected benefits for the members and the community
result: First draft of CEC (or REC) business development plan
remaining_hurdles: |-
  Lack of professional capacities of REC or CEC members/shareholders for more complex technical or financial analysis.
duration: '2-3 weeks'
cost: 'Low to medium'
cost_estimate: '500-2,000 EUR'
cost_range: [500, 2000]
provider: oss
hr:
  name: HR-03-Vrijednosna ponuda
  summary: |-
    Početna vizija projekta treba jasno opisati njegove glavne ciljeve i težnje. Razmotrite moguće ishode projekta kako biste definirali kriterije uspjeha i učinak.
  description: |-
    Pomoć inicijatorima da bolje definiraju: svrhu i viziju zajednice; glavne ciljeve i ishode; moguće koristi za članove i zajednicu
  input: |-
    Inicijatori trebaju dati prve ideje o: svrsi i viziji projekta; mogućim ishodima; očekivanim koristima za članove i zajednicu
  result: Prvi nacrt plana poslovnog razvoja ZGE (ili ZOE)
  remaining_hurdles: |-
    Nedostatak stručnih kapaciteta članova ZOE ili ZGE za složenije tehničke ili financijske analize.
  duration: '2-3 tjedna'
  cost: 'Niska do srednja cijena'
  cost_estimate: '500-2,000 EUR'
  reviewed: false
