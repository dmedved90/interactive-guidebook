name: HR-26-Registration - Tax
step: registration-tax
summary: |-
  In Croatia, it is only possible to register REC or CEC as association - nonprofit organization. Once registered, you will receive a tax verification number.
description: |-
  In the process of registration of association, tax authority will give you VAT number - OIB. Once association is established, apply for entry in Register of nonprofit organizations.
web_link: https://saznaj-oib.porezna-uprava.hr/
input: Statute of organization
result: Tax number - OIB; Entry in the Register of Non-Profit Organizations
duration: '1-2 weeks'
cost: 'Minimal'
cost_estimate: '< 100 EUR'
provider: oss
