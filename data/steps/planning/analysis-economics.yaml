title: Analysis - Economics
sort_order: 190
themes: [solar]
topic: PV Plant
description: Calculate the expenses and earnings for your PV.
objective: |-
  - How much of my electricity can I use myself, sell or donate to others?
  - What is the cashflow generated?
  - What is the break-even point?
  - Is my project economically feasible?
description_long: |-
  When evaluating a PV system, determine how much of the generated electricity you can use personally versus how much can be sold or donated to others. Assess the cash flow generated by the system. Calculate the break-even point to understand how long it will take for the initial investment to be recouped through these savings and revenues.
de:
  title: Analyse - Wirtschaftlichkeit
  description: Berechnen Sie Ausgaben und Erträge Ihrer PV-Anlage.
  objective: |-
    - Wie viel meines Stroms kann ich selbst nutzen, verkaufen oder anderen überlassen?
    - Welcher Cashflow entsteht?
    - Wann ist der Break-even erreicht?
    - Ist mein Projekt wirtschaftlich tragfähig?
  description_long: |-
    Ermitteln Sie bei der Bewertung einer PV-Anlage, wie viel des erzeugten Stroms Sie selbst nutzen können und wie viel verkauft oder anderen überlassen werden kann. Bewerten Sie den Cashflow der Anlage. Berechnen Sie den Break-even-Punkt, um zu sehen, wie lange es dauert, bis sich die Anfangsinvestition durch Einsparungen und Erlöse amortisiert hat.
  reviewed: false
fr:
  title: Analyse - Économie
  description: Calculez les dépenses et les recettes de votre installation photovoltaïque.
  objective: |-
    - Quelle part de mon électricité puis-je consommer, vendre ou donner ?
    - Quel flux de trésorerie l'installation génère-t-elle ?
    - Quel est le seuil de rentabilité ?
    - Mon projet est-il économiquement viable ?
  description_long: |-
    Pour évaluer une installation photovoltaïque, déterminez quelle part de l'électricité produite vous pouvez consommer vous-même et quelle part peut être vendue ou donnée. Évaluez le flux de trésorerie généré. Calculez le seuil de rentabilité pour savoir combien de temps il faudra pour amortir l'investissement initial grâce aux économies et aux recettes.
  reviewed: false
it:
  title: Analisi - Aspetti economici
  description: Calcolate costi e ricavi del vostro impianto fotovoltaico.
  objective: |-
    - Quanta parte della mia energia posso consumare, vendere o cedere ad altri?
    - Quale flusso di cassa si genera?
    - Qual è il punto di pareggio?
    - Il mio progetto è economicamente sostenibile?
  description_long: |-
    Nel valutare un impianto fotovoltaico, stabilite quanta energia prodotta potete usare personalmente e quanta può essere venduta o ceduta ad altri. Valutate il flusso di cassa generato dall'impianto. Calcolate il punto di pareggio per capire in quanto tempo l'investimento iniziale sarà recuperato grazie a risparmi e ricavi.
  reviewed: false
hr:
  title: Analiza - Ekonomičnost
  description: Izračunajte troškove i prihode svoje fotonaponske elektrane.
  objective: |-
    - Koliko električne energije mogu sam iskoristiti, prodati ili ustupiti drugima?
    - Kakav se novčani tok ostvaruje?
    - Kada se ostvaruje točka povrata?
    - Je li moj projekt ekonomski isplativ?
  description_long: |-
    Pri procjeni fotonaponskog sustava utvrdite koliko proizvedene električne energije možete sami iskoristiti, a koliko se može prodati ili ustupiti drugima. Procijenite novčani tok koji sustav ostvaruje. Izračunajte točku povrata kako biste znali koliko će trebati da se početno ulaganje vrati kroz uštede i prihode.
  reviewed: false
bg:
  title: Анализ - Икономика
  description: Изчислете разходите и приходите от вашата фотоволтаична централа.
  objective: |-
    - Каква част от електроенергията си мога да използвам, да продам или да предоставя на други?
    - Какъв паричен поток се генерира?
    - Кога се достига точката на рентабилност?
    - Икономически изгоден ли е проектът ми?
  description_long: |-
    При оценката на фотоволтаична система определете каква част от произведената електроенергия можете да използвате сами и каква част може да се продаде или предостави на други. Оценете паричния поток, генериран от системата. Изчислете точката на рентабилност, за да знаете за колко време първоначалната инвестиция ще се изплати чрез спестявания и приходи.
  reviewed: false
